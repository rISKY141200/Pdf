name: Bangun APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Buat proyek Android
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/assets app/src/main/res/drawable app/src/main/java/com/rizky/pdfviewer

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PembacaPDF"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.rizky.pdfviewer'
              compileSdk 34
              defaultConfig {
                  applicationId "com.rizky.pdfviewer"
                  minSdk 23
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          dependencies {
              implementation 'androidx.webkit:webkit:1.8.0'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Pembaca PDF"
                  android:icon="@drawable/ic_launcher"
                  android:allowBackup="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboardHidden|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:mimeType="application/pdf" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#24509E" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#FFFFFF" android:pathData="M34,24h28l14,14v46a4,4 0 0,1 -4,4H34a4,4 0 0,1 -4,-4V28a4,4 0 0,1 4,-4z" />
              <path android:fillColor="#B9C8E8" android:pathData="M62,24v14h14z" />
              <path android:fillColor="#24509E" android:pathData="M38,52h32v4H38zM38,62h32v4H38zM38,72h20v4H38z" />
          </vector>
          EOF

          cat > app/src/main/java/com/rizky/pdfviewer/MainActivity.java <<'EOF'
          package com.rizky.pdfviewer;

          import android.app.Activity;
          import android.content.Intent;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.OpenableColumns;
          import android.view.View;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.webkit.WebViewAssetLoader;
          import org.json.JSONObject;
          import java.io.InputStream;

          public class MainActivity extends Activity {
              private static final int REQ_PICK = 1;
              private static final String ORIGIN = "https://appassets.androidplatform.net";

              private WebView web;
              private WebViewAssetLoader loader;
              private ValueCallback<Uri[]> pickCallback;
              private Uri currentUri;
              private String currentName = "dokumen.pdf";
              private boolean pageReady = false;
              private boolean pendingOpen = false;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  loader = new WebViewAssetLoader.Builder()
                      .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                      .addPathHandler("/pdf/", new WebViewAssetLoader.PathHandler() {
                          @Override
                          public WebResourceResponse handle(String path) {
                              try {
                                  InputStream in = getContentResolver().openInputStream(currentUri);
                                  return new WebResourceResponse("application/pdf", null, in);
                              } catch (Exception e) {
                                  return null;
                              }
                          }
                      })
                      .build();

                  web = new WebView(this);
                  setContentView(web);
                  web.setOverScrollMode(View.OVER_SCROLL_NEVER);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(true);
                  s.setSupportZoom(false);
                  s.setBuiltInZoomControls(false);

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {
                          return loader.shouldInterceptRequest(r.getUrl());
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          return !r.getUrl().toString().startsWith(ORIGIN);
                      }

                      @Override
                      public void onPageFinished(WebView v, String url) {
                          pageReady = true;
                          if (pendingOpen) {
                              pendingOpen = false;
                              openCurrent();
                          }
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView w, ValueCallback<Uri[]> callback, FileChooserParams params) {
                          if (pickCallback != null) pickCallback.onReceiveValue(null);
                          pickCallback = callback;
                          Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                          i.addCategory(Intent.CATEGORY_OPENABLE);
                          i.setType("application/pdf");
                          try {
                              startActivityForResult(i, REQ_PICK);
                          } catch (Exception e) {
                              pickCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  handleIntent(getIntent());
                  web.loadUrl(ORIGIN + "/assets/index.html");
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  handleIntent(intent);
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == REQ_PICK) {
                      if (pickCallback != null) {
                          Uri[] result = null;
                          if (resultCode == RESULT_OK && data != null && data.getData() != null) {
                              result = new Uri[]{data.getData()};
                          }
                          pickCallback.onReceiveValue(result);
                          pickCallback = null;
                      }
                      return;
                  }
                  super.onActivityResult(requestCode, resultCode, data);
              }

              private void handleIntent(Intent i) {
                  if (i == null || !Intent.ACTION_VIEW.equals(i.getAction()) || i.getData() == null) return;
                  currentUri = i.getData();
                  currentName = queryName(currentUri);
                  if (pageReady) openCurrent(); else pendingOpen = true;
              }

              private void openCurrent() {
                  String url = ORIGIN + "/pdf/current?t=" + System.currentTimeMillis();
                  String js = "window.openFromUrl('" + url + "'," + JSONObject.quote(currentName) + ");";
                  web.evaluateJavascript(js, null);
              }

              private String queryName(Uri uri) {
                  String name = null;
                  Cursor c = null;
                  try {
                      c = getContentResolver().query(uri, null, null, null, null);
                      if (c != null && c.moveToFirst()) {
                          int idx = c.getColumnIndex(OpenableColumns.DISPLAY_NAME);
                          if (idx >= 0) name = c.getString(idx);
                      }
                  } catch (Exception e) {
                      // abaikan, pakai nama cadangan
                  } finally {
                      if (c != null) c.close();
                  }
                  if (name == null || name.length() == 0) name = uri.getLastPathSegment();
                  if (name == null || name.length() == 0) name = "dokumen.pdf";
                  return name;
              }

              @Override
              protected void onDestroy() {
                  if (web != null) web.destroy();
                  super.onDestroy();
              }
          }
          EOF

      - name: Siapkan halaman dan PDF.js (dibundel supaya bisa offline)
        shell: bash
        run: |
          set -e
          BASE=https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105
          curl -fL -o app/src/main/assets/pdf.min.js "$BASE/pdf.min.js"
          curl -fL -o app/src/main/assets/pdf.worker.min.js "$BASE/pdf.worker.min.js"
          sed "s|$BASE/||g" index.html > app/src/main/assets/index.html
          if grep -q cdnjs app/src/main/assets/index.html; then
            echo "Masih ada rujukan CDN di index.html"; exit 1
          fi

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Bangun APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: PembacaPDF-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pembaca PDF build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
